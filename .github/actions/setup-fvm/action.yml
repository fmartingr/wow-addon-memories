name: Set up FVM
description: Install FVM and the Flutter version pinned in .fvmrc. Run dart-lang/setup-dart first.

runs:
  using: composite
  steps:
    # The job runs dart-lang/setup-dart before this action. Inside a composite action, setup-dart looks for its
    # problem matcher in this folder and fails.
    - name: Install FVM
      shell: bash
      run: |
        dart pub global activate fvm 4.3.2
        echo "FVM_CACHE_PATH=$RUNNER_TEMP/fvm" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/fvm
        key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}
    # On Windows pub installs only fvm.bat, which bash cannot find; pwsh can.
    - name: Install the pinned Flutter
      shell: pwsh
      run: fvm install
