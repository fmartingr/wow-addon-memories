name: Set up FVM
description: Install FVM and the Flutter version pinned in .fvmrc.

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      with:
        sdk: 3.13.4
    # setup-dart already puts the pub cache bin folder on PATH.
    - name: Install FVM
      shell: bash
      run: |
        dart pub global activate fvm 4.3.2
        echo "FVM_CACHE_PATH=$RUNNER_TEMP/fvm" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/fvm
        key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}
    # On Windows pub installs only fvm.bat, which bash cannot find; pwsh can.
    - name: Install the pinned Flutter
      shell: pwsh
      run: fvm install
