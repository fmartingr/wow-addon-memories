<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memories</title>
<link rel="icon" href="/_/icon.png">
<link rel="stylesheet" href="/_/base.css">
<link rel="stylesheet" href="/_/style.css">
<script src="/_/kinds.js"></script>
<script src="/_/map/world.js"></script>
<script type="module" src="/_/app.mjs"></script>
</head>
<body>
<div class="frame">
  <header class="frame-head">
    <img class="crest" src="/_/icon.png" alt="" width="44" height="44">
    <div class="head-text">
      <h1 id="headName">Memories</h1>
      <p id="headLine" class="sub"></p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Character pages">
    <button id="tab-summary" class="tab" role="tab" data-tab="summary" aria-controls="panel-summary" aria-selected="true">Summary</button>
    <button id="tab-journey" class="tab" role="tab" data-tab="journey" aria-controls="panel-journey" aria-selected="false" tabindex="-1">Journey map</button>
    <button id="tab-heatmaps" class="tab" role="tab" data-tab="heatmaps" aria-controls="panel-heatmaps" aria-selected="false" tabindex="-1">Heatmaps</button>
  </nav>

  <main class="panels">
    <section id="panel-summary" class="tabpanel" role="tabpanel" aria-labelledby="tab-summary"></section>
    <section id="panel-journey" class="tabpanel fill" role="tabpanel" aria-labelledby="tab-journey" hidden>
      <div class="journey">
        <div class="journey-main">
          <div class="map-wrap" id="journeyWrap">
            <div class="map-stage" id="journeyStage">
              <canvas id="journeyMap" aria-label="World map with the journey trail"></canvas>
              <div class="flash" id="flash"></div>
              <div class="banner" id="banner" aria-live="polite"><div id="bZone"></div><div id="bSub"></div></div>
              <div class="toasts" id="toasts" aria-live="polite"></div>
              <div class="map-tools">
                <button type="button" class="btn icon" id="zIn" aria-label="Zoom in">+</button>
                <div class="zlevel" id="zLevel">World</div>
                <button type="button" class="btn icon" id="zOut" aria-label="Zoom out">−</button>
                <button type="button" class="btn" id="follow" aria-pressed="false">Follow</button>
                <button type="button" class="btn" id="zWorld">World</button>
              </div>
              <div class="tip" id="tip" hidden></div>
              <div class="tip detail" id="detail" role="dialog" aria-label="Event details" hidden></div>
            </div>
          </div>
          <div class="timeline">
            <div class="transport">
              <button type="button" class="btn icon" id="rew" aria-label="Back to start" title="Back to start">⏮</button>
              <button type="button" class="btn icon big" id="play" aria-label="Play" title="Play (Space)">▶</button>
              <div class="speeds" role="group" aria-label="Speed">
                <button type="button" class="btn chip on" data-speed="1" aria-pressed="true">1×</button>
                <button type="button" class="btn chip" data-speed="2" aria-pressed="false">2×</button>
                <button type="button" class="btn chip" data-speed="4" aria-pressed="false">4×</button>
                <button type="button" class="btn chip" data-speed="8" aria-pressed="false">8×</button>
                <button type="button" class="btn chip" data-speed="16" aria-pressed="false">16×</button>
              </div>
              <button type="button" class="btn speed-cycle" id="speedCycle" aria-label="Change speed">1×</button>
              <div class="readout">
                <div class="time" id="rTime">0:00:00</div>
                <div class="coins" id="rGold"></div>
                <div class="sub" id="rWhere"></div>
              </div>
            </div>
            <div class="track-wrap"><canvas id="tl" aria-label="Journey timeline"></canvas></div>
          </div>
        </div>
        <aside class="sheet" id="journeySheet" data-state="peek" aria-label="Journal log and markers">
          <button type="button" class="sheet-handle" aria-label="Journal log and markers" aria-expanded="false"></button>
          <div class="sheet-body">
            <h3 class="panel-title">Journal log</h3>
            <ol id="feed" class="feed"></ol>
            <fieldset class="filters">
              <legend>Markers</legend>
              <label><input type="checkbox" data-cat="level" checked><i class="sw" data-c="#ffd100"></i>Levels</label>
              <label><input type="checkbox" data-cat="danger" checked><i class="sw" data-c="#d8402f"></i>Danger</label>
              <label><input type="checkbox" data-cat="dungeon" checked><i class="sw" data-c="#a45ee8"></i>Dungeons</label>
              <label><input type="checkbox" data-cat="quest" checked><i class="sw" data-c="#4a90ff"></i>Quests, travel</label>
              <label><input type="checkbox" data-cat="find" checked><i class="sw" data-c="#35c9a0"></i>Finds, loot</label>
              <label><input type="checkbox" data-cat="world" checked><i class="sw" data-c="#3fbf6a"></i>Reputation, world</label>
              <label><input type="checkbox" data-cat="shot" checked><i class="sw" data-c="#cfd8e3"></i>Screenshots</label>
            </fieldset>
          </div>
        </aside>
      </div>
      <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot" hidden>
        <figure><img id="lightboxImg" alt=""><figcaption id="lightboxCap"></figcaption></figure>
      </div>
    </section>
    <section id="panel-heatmaps" class="tabpanel fill" role="tabpanel" aria-labelledby="tab-heatmaps" hidden>
      <div class="heat">
        <div class="map-wrap" id="heatWrap">
          <div class="map-stage">
            <canvas id="heatMap" aria-label="Heat map of where things happened"></canvas>
            <div class="map-tools">
              <button type="button" class="btn icon" id="hIn" aria-label="Zoom in">+</button>
              <div class="zlevel" id="hLevel">World</div>
              <button type="button" class="btn icon" id="hOut" aria-label="Zoom out">−</button>
              <button type="button" class="btn" id="hWorld">World</button>
            </div>
            <div class="legend" id="legend">
              <canvas id="legendRamp" width="160" height="10" aria-hidden="true"></canvas>
              <div id="legendCount"></div>
              <div id="legendUnplaced" class="sub"></div>
              <div id="legendEmpty"></div>
            </div>
            <div class="tip" id="hTip" hidden></div>
          </div>
        </div>
        <aside class="sheet" id="heatSheet" data-state="peek" aria-label="Layers">
          <button type="button" class="sheet-handle" aria-label="Layers" aria-expanded="false"></button>
          <div class="sheet-body">
            <fieldset class="filters" id="layerPicker">
              <legend>Layer</legend>
              <label><input type="radio" name="heatLayer" value="presence" checked><i class="sw" data-c="#ffd100"></i>Presence</label>
              <label><input type="radio" name="heatLayer" value="kills"><i class="sw" data-c="#ff5a43"></i>Kills</label>
              <label><input type="radio" name="heatLayer" value="deaths"><i class="sw" data-c="#c58cff"></i>Deaths</label>
              <label><input type="radio" name="heatLayer" value="gathering"><i class="sw" data-c="#35c9a0"></i>Gathering</label>
              <label><input type="radio" name="heatLayer" value="fishing"><i class="sw" data-c="#4fa8e0"></i>Fishing</label>
              <label><input type="radio" name="heatLayer" value="quests"><i class="sw" data-c="#f2a93b"></i>Quests</label>
              <label><input type="radio" name="heatLayer" value="loot"><i class="sw" data-c="#9ad65f"></i>Loot</label>
            </fieldset>
            <fieldset class="filters" id="profPicker" hidden>
              <legend>Profession</legend>
              <label><input type="radio" name="heatProf" value="all" checked>All</label>
              <label><input type="radio" name="heatProf" value="mining">Mining</label>
              <label><input type="radio" name="heatProf" value="herbalism">Herbalism</label>
              <label><input type="radio" name="heatProf" value="skinning">Skinning</label>
              <label><input type="radio" name="heatProf" value="other">Other</label>
            </fieldset>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <p class="legal" id="legal"></p>
  <div id="status" role="status"></div>
</div>
</body>
</html>
