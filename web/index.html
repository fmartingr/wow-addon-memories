<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memories</title>
<link rel="icon" href="/_/icon.png">
<link rel="stylesheet" href="/_/style.css">
<script src="/_/kinds.js"></script>
<script type="module" src="/_/app.mjs"></script>
</head>
<body>
<div class="frame">
  <header class="frame-head">
    <img class="crest" src="/_/icon.png" alt="" width="44" height="44">
    <div class="head-text">
      <h1 id="headName">Memories</h1>
      <p id="headLine" class="sub"></p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Character pages">
    <button id="tab-summary" class="tab" role="tab" data-tab="summary" aria-controls="panel-summary" aria-selected="true">Summary</button>
    <button id="tab-journey" class="tab" role="tab" data-tab="journey" aria-controls="panel-journey" aria-selected="false" tabindex="-1">Journey map</button>
    <button id="tab-heatmaps" class="tab" role="tab" data-tab="heatmaps" aria-controls="panel-heatmaps" aria-selected="false" tabindex="-1">Heatmaps</button>
  </nav>

  <main class="panels">
    <section id="panel-summary" class="tabpanel" role="tabpanel" aria-labelledby="tab-summary"></section>
    <section id="panel-journey" class="tabpanel" role="tabpanel" aria-labelledby="tab-journey" hidden></section>
    <section id="panel-heatmaps" class="tabpanel" role="tabpanel" aria-labelledby="tab-heatmaps" hidden></section>
  </main>

  <p class="legal" id="legal"></p>
  <div id="status" role="status"></div>
</div>
</body>
</html>
