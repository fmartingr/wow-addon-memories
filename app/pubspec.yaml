name: wow_journey
description: "Gathers the Memories addon data from the WoW folder."
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter

  launch_at_startup: ^0.5.1
  memories_core:
    path: ../packages/memories_core
  path: ^1.9.1
  path_provider: ^2.1.6
  tray_manager: ^0.8.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
