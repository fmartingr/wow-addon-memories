name: wow_journey
description: "Gathers the Memories addon data from the WoW folder."
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  launch_at_startup: ^0.5.1
  memories_core:
    path: ../packages/memories_core
  path: ^1.9.1
  path_provider: ^2.1.6
  tray_manager: ^0.8.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/crest.png
    - assets/fonts/OFL.txt
    - assets/viewer/
    - assets/viewer/fonts/
    - assets/viewer/i18n/
    - assets/viewer/lib/
    - assets/viewer/map/
    - assets/viewer/map/art/
    - assets/viewer/map/mini/0/
    - assets/viewer/map/mini/1/
    - assets/viewer/map/tiles/0/
    - assets/viewer/map/tiles/1/
    - assets/viewer/map/tiles/2/
    - assets/viewer/map/tiles/3/
    - assets/viewer/map/tiles/4/
    - assets/viewer/map/tiles/5/
    - assets/viewer/ui/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Alegreya Sans
      fonts:
        - asset: assets/fonts/AlegreyaSans-400.ttf
        - asset: assets/fonts/AlegreyaSans-500.ttf
          weight: 500
        - asset: assets/fonts/AlegreyaSans-700.ttf
          weight: 700
